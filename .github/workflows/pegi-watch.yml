name: Vigilante PEGI GTA VI

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Enviar mensaje de prueba a Discord"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pegi-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Ejecutar vigilante
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NEWS_ALERTS: "true"
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python pegi_watch.py --test
          else
            python pegi_watch.py
          fi

      - name: Guardar estado
        run: |
          git config user.name "pegi-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json || true
          git diff --staged --quiet || (git commit -m "Actualizar estado" && git push)
